[project]
name = "rebuild-any-web"
version = "0.4.0"
description = "Rebuild Any Web workflow: RSI exploration, shared E2E molds, and native Goal continuation"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
images = ["Pillow>=12,<13"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capabilities*", "runtime*", "workflows*", "scripts*"]

[tool.setuptools.package-data]
workflows = ["**/*.md"]

[tool.ruff]
line-length = 110
